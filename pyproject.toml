[project]
name = "personal-chat-bot-wechat"
version = "1.0.0"
description = "Single-account DeepSeek WeChat bot driven by wxauto4 and LangChain"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langchain>=1.4,<2",
    "langchain-deepseek>=1.1,<2",
    "pydantic>=2.14,<3",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.2,<2",
    "wxauto4>=41.1.7,<42; sys_platform == 'win32'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
