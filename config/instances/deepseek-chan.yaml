instance_id: deepseek-chan
persona_id: deepseek-chan
database_path: ./data/bot.db

wechat:
  # Single WeChat account. Used to namespace local data and state.
  account_id: wechat-main

  # Chats to monitor. Use the exact chat name shown in WeChat.
  # kind=direct: every message is addressed to the bot.
  # kind=group: the bot only treats @mentions as direct; other messages go
  # through the participation gate.
  chats:
    - name: "我的朋友很少"
      kind: group
    - name: "老窝🌹🍎🍑💖"
      kind: group
    - name: "小窝儿 🎵 🎵 🎵"
      kind: group
      # 可以单独给某个群设置图片缓存数量（不写就用下面的全局值）
      # image_cache_size: 20

  poll_interval_seconds: 20.0
  # 轮询节奏抖动：窗口切换不要精确到毫秒，±50% 随机。
  poll_jitter_ratio: 0.5
  # 每轮询这么多次“离开一会儿”，模拟人不在电脑前。12 轮 × 20 秒 ≈ 连续活动 4 分钟。
  poll_burst_size: 12
  # 离开的时长要明显长于“看一眼就走”的间隔，否则等于全天在线。
  poll_pause_min_seconds: 90
  poll_pause_max_seconds: 300
  # 发送前先“读+打字”的延时（秒）：基准 + 每字 + 随机抖动，0 = 关闭整套延时。
  # 0.3 秒/字 ≈ 3.3 字/秒，接近真人，而不是 5 字/秒的“超人打字”。
  send_delay_seconds: 1.0
  send_delay_per_char_seconds: 0.3
  send_delay_jitter_seconds: 1.5
  # 上限要覆盖正常长度的回复；长回复靠拆成多条，而不是靠把打字时间压到 25 秒。
  send_delay_max_seconds: 60
  # 一次发送完成后的小停顿。
  send_gap_seconds: 2.0
  # 作息窗口（本机时区）：窗口内才允许发消息，窗口外照常读取但保持沉默。
  # start > end 表示跨午夜（例如 08:00 → 01:00）。两边都写 null 表示全天在线。
  active_hours_start: "08:00"
  active_hours_end: "01:00"
  # Optional. If omitted, the logged-in WeChat nickname is used for @ detection.
  bot_name: null
  text_only: true
  # 下载并识别图片：先让视觉模型生成一句描述给参与判断，原图再随消息交给 Agent。
  # 其他非文本类型（语音/文件/视频）仍然跳过。
  capture_images: true
  # 图片 FIFO 缓存：每个聊天保留最近这么多张图（先进先出，满了删最旧的）。
  # 0 = 不缓存。单个聊天可以用 chats[].image_cache_size 覆盖。
  image_cache_size: 10
  # 一次追问最多把几张缓存原图附给模型（其余图片只给「发送者+时间+图注」）。
  image_followup_max_images: 3
  # 缓存有效期（秒）：超过这个时间的图会被清掉，只能靠当时的文字描述。
  image_followup_seconds: 120

tools:
  - search_memory
  - get_user_profile
  - web_search

model:
  provider: deepseek
  model_name: deepseek-chat
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.9
  timeout_seconds: 60
  max_retries: 2

# 联网搜索（DeepSeek 官方 Search API，与模型共用同一个 key）。
# 按请求计费（$0.75 / 1000 次），不需要额外申请；从 tools 里删掉 web_search 即可关闭。
web_search:
  max_results: 5
  timeout_seconds: 10
  include_content: false
  api_base: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY

memory:
  enabled: true
  allow_shared_memory: false
  # 每个聊天攒够这么多条（未抽取的）消息就跑一次记忆抽取；重启后不会清零。
  extraction_threshold: 5
  extraction_batch_size: 18
  extraction_max_attempts: 3
  extraction_timeout_seconds: 90
  # 待抽取的消息会存进数据库（pending_messages 表），进程重启后继续累计。
  # 设为 false 则回到「只在内存里」的旧行为。
  persist_pending: true
  pending_max_per_channel: 200
  max_memories_per_search: 5
  max_memory_chars: 500
  min_importance: 0.35
  min_confidence: 0.45

agent:
  max_tool_rounds: 3
  # 再长就是一段“毫无动静然后突然说话”的空白；真人的停顿不会一直被撑满。
  timeout_seconds: 90

reply:
  mention_priority: true
  # 冷却决定“能不能跟上别人的节奏”。5 秒能在群里一分钟答十几条，很不像人。
  channel_cooldown_seconds: 45
  user_cooldown_seconds: 25
  continuation_window_seconds: 180
  # 延续对话可以快，但 1~2 秒接话是人类打不出来的。
  continuation_channel_cooldown_seconds: 12
  continuation_user_cooldown_seconds: 8
  # 被冷却挡下的消息在冷却结束后再判断一次（只重试一次），
  # 避免某个人一直在聊，其他人插话时永远被冷却丢掉。
  # 重试窗口不要太长，否则回复会以近似等间隔出现，反而更像机器。
  retry_on_cooldown: true
  max_cooldown_retry_seconds: 8
  # 微信里 1800 字是一堵墙；正常聊天单条很少超过几百字。
  max_reply_length: 450
  # 长回复拆成 2~3 条分开发，中间随机停顿，像人打字后分句发。
  split_replies: true
  split_min_chars: 160
  split_max_parts: 3
  split_probability: 0.8
  split_gap_min_seconds: 0.8
  split_gap_max_seconds: 3.0
  # Single account: no cross-instance claim is needed.
  claim_message_across_instances: false
  message_claim_ttl_seconds: 120

context:
  max_messages: 30
  merge_window_seconds: 3

participation:
  enabled: true
  # 判断器通过后再掷一次骰子。不是 @ 的时候大部分时间应保持沉默。
  reply_probability: 0.2
  # 判断器同时给出 0~1 的“兴趣分”；低于这个分就算它说该回也不回。
  min_interest: 0.55
  # 话题级限流：刚回过的这几秒内，别人继续聊同一话题基本不再插话，
  # 于是一个话题大致只回一次，而不是每个人每条都回。
  topic_window_seconds: 120
  topic_window_reply_probability: 0.15
  ignore_other_mentions: true
  # WeChat cannot reliably distinguish bots from humans; these options are
  # retained for future use and currently have no practical effect.
  reply_to_other_bots: false
  bot_reply_probability: 0.1
  allow_consecutive_bot_messages: false
  max_context_messages: 15
  timeout_seconds: 30
  default_reply_on_error: false
